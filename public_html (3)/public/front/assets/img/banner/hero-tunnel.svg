<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="tunnelFade" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a5a5a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a3a3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="900" fill="url(#tunnelFade)"/>

  <!-- converging floor / ceiling perspective lines -->
  <g stroke="url(#lineFade)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M -100 900 L 960 420 L 2020 900"/>
    <path d="M 100 900 L 960 460 L 1820 900"/>
    <path d="M 300 900 L 960 500 L 1620 900"/>
    <path d="M 500 900 L 960 540 L 1420 900"/>
    <path d="M -100 60 L 960 380 L 2020 60"/>
    <path d="M 150 -20 L 960 340 L 1770 -20"/>
  </g>

  <!-- side wall panel lines -->
  <g stroke="#2c2c2c" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 40 250 L 420 300 L 420 620 L 40 700"/>
    <path d="M 1880 250 L 1500 300 L 1500 620 L 1880 700"/>
  </g>

  <!-- steering wheel silhouette (left, matches interior-cockpit look) -->
  <g transform="translate(300,470)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="170" ry="150" fill="none" stroke="#3f3f3f" stroke-width="14"/>
    <ellipse cx="0" cy="0" rx="170" ry="150" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="#161616" stroke="#3f3f3f" stroke-width="6"/>
    <path d="M -150 -40 L -40 -10 M 150 -40 L 40 -10 M 0 130 L 0 42" stroke="#3f3f3f" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- soft red ambient glow, echoes the brand color -->
  <ellipse cx="960" cy="620" rx="520" ry="90" fill="#e11d2a" opacity="0.08"/>
</svg>
